<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Emerald-to-Teal Gradient for the Lens Ring -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Gold Gradient for the AI Sparkle -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Safe Zone: All artwork sits inside the center 66x66 circle (coords 21 to 87) -->

  <!-- Camera Body Silhouette -->
  <path d="M 38 33 L 43 27 L 65 27 L 70 33 L 76 33 C 80 33 83 36 83 40 L 83 72 C 83 76 80 79 76 79 L 32 79 C 28 79 25 76 25 72 L 25 40 C 25 36 28 33 32 33 Z" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Outer Camera Lens / Plate Ring -->
  <circle cx="54" cy="56" r="19" fill="#0F172A" stroke="url(#lensGrad)" stroke-width="4" />

  <!-- Subtle Inner Lens Glass Ring -->
  <circle cx="54" cy="56" r="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" />

  <!-- Stylized Fork Centered Inside the Lens -->
  <g fill="none" stroke="#F8FAFC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left, Center, and Right Tines -->
    <path d="M 49 43 L 49 52 C 49 55.5 51.5 57.5 54 57.5 C 56.5 57.5 59 55.5 59 52 L 59 43" />
    <path d="M 54 43 L 54 57.5" />
    <!-- Fork Handle Extending to Bottom of Lens -->
    <path d="M 54 57.5 L 54 70" stroke-width="3.2" />
  </g>

  <!-- AI 4-Point Sparkle (Top-Right Flash / AI Indicator) -->
  <path d="M 73 36 Q 73 41 78 41 Q 73 41 73 46 Q 73 41 68 41 Q 73 41 73 36 Z" fill="url(#sparkleGrad)" />
</svg>